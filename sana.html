<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Special Tease App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Smooth bounce animation */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-gentle {
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        /* Floating background elements */
        .bg-floating-item {
            position: absolute;
            pointer-events: none;
            opacity: 0.3;
            animation: float-around 14s linear infinite;
        }

        @keyframes float-around {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        /* Dodge Button absolute positioning transition */
        .evading-btn {
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Dynamic Floating Toast */
        .toast-popup {
            animation: toast-up 1.2s ease-out forwards;
        }
        @keyframes toast-up {
            0% { opacity: 0; transform: translateY(10px) scale(0.9); }
            20% { opacity: 1; transform: translateY(0) scale(1.05); }
            80% { opacity: 1; transform: translateY(-15px) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.9); }
        }

        /* Canvas Overlay */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 60;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative min-h-screen">

    <!-- FX Canvas (Confetti & Fireworks) -->
    <canvas id="fx-canvas"></canvas>

    <!-- Floating Background Decor -->
    <div id="bg-decor-container"></div>

    <!-- Floating Toast Notification Container -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none w-full max-w-xs px-2"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md mx-auto z-10">
        <!-- Progress Bar & Header -->
        <div class="mb-4 text-center">
            <div class="inline-block bg-white/90 px-4 py-1.5 rounded-full shadow-sm border border-pink-200 mb-3">
                <span id="step-badge" class="text-pink-600 font-extrabold text-sm tracking-wide uppercase">Step 1 of 4</span>
            </div>
            <div class="w-full bg-white/60 h-3 rounded-full overflow-hidden p-0.5 shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-pink-500 to-rose-400 h-full rounded-full transition-all duration-500 w-1/4"></div>
            </div>
        </div>

        <!-- Dynamic Card -->
        <div id="main-card" class="glass-card rounded-3xl p-6 md:p-8 text-center relative transition-all duration-300 transform">
            <!-- Playful Character/Icon Header -->
            <div class="relative w-24 h-24 md:w-28 md:h-28 mx-auto mb-4 flex items-center justify-center bg-pink-100 rounded-full border-4 border-pink-300 animate-gentle shadow-inner">
                <span id="card-emoji" class="text-5xl md:text-6xl select-none">🙋‍♀️</span>
            </div>

            <!-- Title / Question -->
            <h1 id="question-text" class="text-2xl md:text-3xl font-black text-gray-800 mb-2 leading-snug">
                Kaise ho Sana?
            </h1>

            <!-- Subtitle / Teasing Dialog -->
            <p id="sub-text" class="text-gray-600 text-sm md:text-base mb-6 min-h-[48px] font-semibold flex items-center justify-center">
                Aaj ka din kaisa chal raha hai tera?
            </p>

            <!-- Action Area / Buttons Container -->
            <div id="action-area" class="relative min-h-[160px] flex flex-col items-center justify-center gap-3">
                <!-- Dynamic Buttons injected here -->
            </div>
        </div>

        <!-- Footer tag -->
        <div class="text-center mt-5 text-pink-900/70 text-xs font-black tracking-widest uppercase">
            Designed Especially for Sana 💖
        </div>
    </main>

    <script>
        // Web Audio API Sound Effects
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playPop() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            },
            playDodged() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(700, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e){}
            },
            playVictory() {
                try {
                    this.init();
                    const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.09 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + idx * 0.09);
                        osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
                    });
                } catch(e){}
            }
        };

        // App State Variables
        let currentStep = 1;
        let dodgeCount = 0;
        let isFinalUnlocked = false;

        // Prank Messages on Dodge Attempts
        const dodgeToastMessages = [
            "Haha pakad ke dikhao! 😜",
            "Tapped too slow, Sana! 😂",
            "Itni slow touch? Try again! ⚡",
            "Opps! Phir se miss ho gaya! 🤪",
            "Koshish jaari rakho Sana! 🙈",
            "Yeh buttons pakadna namumkin hai! 🚀",
            "Bas ek do baar aur try karo! 😝"
        ];

        // Steps Configuration
        const stepsData = {
            1: {
                badge: "Step 1 of 4",
                progress: "25%",
                emoji: "🙋‍♀️",
                title: "Kaise ho Sana?",
                sub: "Pakka sach bolna, koi natak nahi! 😜",
                type: "choice",
                options: [
                    {
                        text: "Badiya / Maza aa raha hai 🎉",
                        class: "bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-200",
                        nextStep: 2,
                        feedback: "Wah! Matlab mera code dekh kar khush ho gayi? 😁"
                    },
                    {
                        text: "Sahi nahi hai... 😒",
                        class: "bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-200",
                        nextStep: 2,
                        feedback: "Acha ji? Ruk abhi aage dekh, mood badiya kar dunga! 😜"
                    }
                ]
            },
            2: {
                badge: "Step 2 of 4",
                progress: "50%",
                emoji: "🧐",
                title: "Sana kitni nautanki hai?",
                sub: "Imaandari se batao, duniya ko pata chalna chahiye!",
                type: "choice",
                options: [
                    {
                        text: "Thodi Boht (50%) 🙈",
                        class: "bg-purple-500 hover:bg-purple-600 text-white shadow-lg shadow-purple-200",
                        nextStep: 3,
                        feedback: "Jhooth! 50% nahi 100% ho tum! 😜"
                    },
                    {
                        text: "Extreme Level (1000%) 🎭",
                        class: "bg-amber-500 hover:bg-amber-600 text-white shadow-lg shadow-amber-200",
                        nextStep: 3,
                        feedback: "Hahaha! Atleast tune accept to kiya Sana! 😂"
                    }
                ]
            },
            3: {
                badge: "Step 3 of 4",
                progress: "75%",
                emoji: "🍕",
                title: "Party / Treat kab de rahi ho?",
                sub: "Date aur time fix kar lo jaldi se!",
                type: "choice",
                options: [
                    {
                        text: "Aaj shaam ko hi 🍔🍕",
                        class: "bg-indigo-500 hover:bg-indigo-600 text-white shadow-lg shadow-indigo-200",
                        nextStep: 4,
                        feedback: "Done! Location WhatsApp kar do jaldi! 😋"
                    },
                    {
                        text: "Agale janam me 🙈",
                        class: "bg-teal-500 hover:bg-teal-600 text-white shadow-lg shadow-teal-200",
                        nextStep: 4,
                        feedback: "Kanjoos Sana! Chalo chalega 😜"
                    }
                ]
            },
            4: {
                badge: "Step 4 of 4 - The Ultimate Prank",
                progress: "100%",
                emoji: "😈",
                title: "Sana, kya tum manoge ki tum sabse badi nautanki ho?",
                sub: "Koi ek button dabakar dikhao to jaane! 😜",
                type: "prank"
            }
        };

        // DOM Element Cache
        const stepBadge = document.getElementById('step-badge');
        const progressBar = document.getElementById('progress-bar');
        const cardEmoji = document.getElementById('card-emoji');
        const questionText = document.getElementById('question-text');
        const subText = document.getElementById('sub-text');
        const actionArea = document.getElementById('action-area');
        const toastContainer = document.getElementById('toast-container');

        // Show Temporary Floating Toast
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast-popup bg-gray-900/90 text-white text-sm font-bold px-4 py-2 rounded-full shadow-2xl text-center border border-pink-400/40 backdrop-blur-md mb-2';
            toast.textContent = msg;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 1200);
        }

        // Render Current Step Screen
        function renderStep(stepIndex) {
            const data = stepsData[stepIndex];
            currentStep = stepIndex;

            // Update UI Progress Header
            stepBadge.textContent = data.badge;
            progressBar.style.width = data.progress;
            cardEmoji.textContent = data.emoji;
            questionText.textContent = data.title;
            subText.textContent = data.sub;

            // Clear Actions
            actionArea.innerHTML = '';

            if (data.type === "choice") {
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `w-full py-3.5 px-6 rounded-2xl font-black text-base md:text-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 ${opt.class}`;
                    btn.innerHTML = opt.text;
                    btn.onclick = () => {
                        AudioFX.playPop();
                        subText.textContent = opt.feedback;
                        btn.disabled = true;
                        setTimeout(() => {
                            renderStep(opt.nextStep);
                        }, 1200);
                    };
                    actionArea.appendChild(btn);
                });
            } else if (data.type === "prank") {
                dodgeCount = 0;
                isFinalUnlocked = false;

                // Step 4 Layout: Both buttons flee!
                const prankContainer = document.createElement('div');
                prankContainer.className = "w-full flex flex-col sm:flex-row items-center justify-center gap-4 relative py-2 min-h-[120px]";

                const createDodgingButton = (text, bgClass, id) => {
                    const btn = document.createElement('button');
                    btn.id = id;
                    btn.className = `evading-btn w-full sm:w-1/2 py-3.5 px-6 rounded-2xl font-black text-lg text-white shadow-xl cursor-pointer ${bgClass}`;
                    btn.innerHTML = text;
                    
                    // Dodge Trigger Handler for ALL touch, click, hover events
                    const triggerDodge = (e) => {
                        if (isFinalUnlocked) return;
                        if (e) {
                            e.preventDefault();
                            e.stopPropagation();
                        }

                        dodgeCount++;
                        AudioFX.playDodged();

                        // Show dynamic funny toast message
                        const msg = dodgeToastMessages[(dodgeCount - 1) % dodgeToastMessages.length];
                        showToast(msg);

                        // If Sana tries 8 times, unlock sweet surprise reward!
                        if (dodgeCount >= 8) {
                            unlockSweetFinal();
                            return;
                        }

                        // Calculate Random Viewport Position (Keeping fully visible inside mobile screen)
                        const padding = 20;
                        const btnWidth = btn.offsetWidth || 140;
                        const btnHeight = btn.offsetHeight || 50;

                        const maxX = window.innerWidth - btnWidth - padding;
                        const maxY = window.innerHeight - btnHeight - padding;

                        const newX = Math.max(padding, Math.floor(Math.random() * maxX));
                        const newY = Math.max(padding, Math.floor(Math.random() * maxY));

                        // Convert to Fixed positioning on first dodge
                        btn.style.position = 'fixed';
                        btn.style.left = `${newX}px`;
                        btn.style.top = `${newY}px`;
                        btn.style.zIndex = '100';
                    };

                    // Multi-event listeners for instant evasion on Mobile & Desktop
                    ['touchstart', 'pointerdown', 'mouseover', 'mousemove', 'click'].forEach(evt => {
                        btn.addEventListener(evt, triggerDodge, { passive: false });
                    });

                    return btn;
                };

                const btnHaan = createDodgingButton("Haan! 🙈", "bg-green-500 hover:bg-green-600 shadow-green-200", "btn-haan");
                const btnNahi = createDodgingButton("Nahi! ❌", "bg-rose-500 hover:bg-rose-600 shadow-rose-200", "btn-nahi");

                prankContainer.appendChild(btnHaan);
                prankContainer.appendChild(btnNahi);
                actionArea.appendChild(prankContainer);
            }
        }

        // Secret Auto-Unlock Sweet Final Stage (Triggered after 8 attempts)
        function unlockSweetFinal() {
            isFinalUnlocked = true;
            AudioFX.playVictory();
            triggerConfettiAndFireworks();

            // Clear dodging buttons from body
            const b1 = document.getElementById('btn-haan');
            const b2 = document.getElementById('btn-nahi');
            if (b1) b1.remove();
            if (b2) b2.remove();

            // Render Sweet Final Message Card
            cardEmoji.textContent = "💖🎉";
            questionText.textContent = "Sana, You Are The Best! ✨";
            subText.innerHTML = "Tum chahe kitni bhi dramebaaz ho ya mere sawalon ka jawab do ya na do... <br><strong class='text-pink-600 text-lg block mt-2'>You are always the best! 💖</strong>";

            actionArea.innerHTML = '';
            const replayBtn = document.createElement('button');
            replayBtn.className = "w-full py-4 px-6 rounded-2xl font-black text-lg bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white shadow-xl shadow-pink-300 transition-all transform active:scale-95";
            replayBtn.innerHTML = "Phir Se Khelo! 🔄";
            replayBtn.onclick = () => {
                AudioFX.playPop();
                renderStep(1);
            };
            actionArea.appendChild(replayBtn);
        }

        // Particle Effects (Confetti & Fireworks)
        function triggerConfettiAndFireworks() {
            const canvas = document.getElementById('fx-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#f43f5e'];

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 12
                });
            }

            let animationFrame;
            const animate = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.22; // Gravity
                    p.rotation += p.rotSpeed;

                    if (p.y < canvas.height) alive = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (alive) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(animationFrame);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            };
            animate();
        }

        // Ambient Floating Background Emojis
        function setupBackground() {
            const container = document.getElementById('bg-decor-container');
            const emojis = ['💖', '✨', '⭐', '🎈', '🌸', '😜', '💖', '⭐'];
            
            for (let i = 0; i < 18; i++) {
                const item = document.createElement('div');
                item.className = 'bg-floating-item text-2xl md:text-3xl select-none';
                item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                item.style.left = `${Math.random() * 95}%`;
                item.style.animationDuration = `${7 + Math.random() * 9}s`;
                item.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(item);
            }
        }

        // Initialize App
        window.onload = () => {
            setupBackground();
            renderStep(1);
        };
    </script>
</body>
</html>
